  <rect x="1" y="1" width="998" height="198" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  <text x="500" y="88" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="68" font-weight="700" fill="url(#gold)" filter="url(#glow)">Sabreen Ali</text>
